# Minimal MPD config for in-container use.
# Mount your music library read-only at /music.

music_directory     "/var/lib/mpd/music"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/database"
log_file            "syslog"
pid_file            "/var/run/mpd/pid"

# Unix socket the bot/mpc connect to for control (play/pause/queue/etc)
bind_to_address     "/var/run/mpd/socket"

# Optional: also listen on TCP so the control port is reachable from outside the container
bind_to_address    "0.0.0.0"
port               "6600"

# HTTP streaming output — clients (or your bot's listeners) connect here to
# actually hear audio, separate from the control connection above.
audio_output {
    type            "httpd"
    name            "HTTP Stream"
    encoder         "vorbis"        # or "lame" for mp3 (needs libmp3lame in the image)
    port            "8000"
    bitrate         "128"
    format          "44100:16:2"
    max_clients     "0"             # 0 = unlimited
}